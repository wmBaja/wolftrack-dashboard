name: Build Electron App

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Checkout the frontend (Dashboard)
      - name: Checkout Dashboard
        uses: actions/checkout@v4
        with:
          path: dashboard

      # 2. Download the backend (Visualizer)
      - name: Determine Backend Tag
        id: backend-tag
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            LATEST_TAG=$(gh release view --repo wmBaja/wolftrack-visualizer --json tagName -jq .tagName)
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Download Backend Binary
        shell: bash
        run: |
          mkdir -p dashboard/backend
          TAG="${{ steps.backend-tag.outputs.tag }}"

          if ! gh release view "$TAG" --repo wmBaja/wolftrack-visualizer > /dev/null 2>&1; then
            echo "Error: Release '$TAG' not found in wmBaja/wolftrack-visualizer"
            exit 1
          fi

          if [ "${{ runner.os }}" == "Windows" ]; then
            gh release download "$TAG" --repo wmBaja/wolftrack-visualizer --pattern "wolftrack-visualizer-windows.exe" --dir dashboard/backend
            mv dashboard/backend/wolftrack-visualizer-windows.exe dashboard/backend/wolftrack-visualizer.exe
            
          elif [ "${{ runner.os }}" == "macOS" ]; then
            gh release download "$TAG" --repo wmBaja/wolftrack-visualizer --pattern "wolftrack-visualizer-macos" --dir dashboard/backend
            mv dashboard/backend/wolftrack-visualizer-macos dashboard/backend/wolftrack-visualizer
            chmod +x dashboard/backend/wolftrack-visualizer
            
          else
            gh release download "$TAG" --repo wmBaja/wolftrack-visualizer --pattern "wolftrack-visualizer-linux" --dir dashboard/backend
            mv dashboard/backend/wolftrack-visualizer-linux dashboard/backend/wolftrack-visualizer
            chmod +x dashboard/backend/wolftrack-visualizer
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # 3. Setup environments
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Inject Environment Variables into the bundled backend
      - name: Configure .env
        shell: bash
        env:
          ZMQ_ENABLED: ${{ secrets.ZMQ_ENABLED }}
          ZMQ_PORT: ${{ secrets.ZMQ_PORT }}
          ZMQ_HOST: ${{ secrets.ZMQ_HOST }}
          FASTAPI_HOST: ${{ secrets.FASTAPI_HOST }}
          FASTAPI_PORT: ${{ secrets.FASTAPI_PORT }}
          APP_LOG_DIR: ${{ secrets.APP_LOG_DIR }}
          APP_LOG_LEVEL: ${{ secrets.APP_LOG_LEVEL }}
          APP_LOG_TO_CONSOLE: ${{ secrets.APP_LOG_TO_CONSOLE }}
          APP_LOG_TO_FILE: ${{ secrets.APP_LOG_TO_FILE }}
          APP_LOG_MAX_FILE_SIZE_MB: ${{ secrets.APP_LOG_MAX_FILE_SIZE_MB }}
          APP_LOG_BACKUP_COUNT: ${{ secrets.APP_LOG_BACKUP_COUNT }}
          APP_LOG_FORMAT: ${{ secrets.APP_LOG_FORMAT }}
        run: |
          cd dashboard/backend
          echo "ZMQ_ENABLED=${ZMQ_ENABLED:-true}" >> .env
          echo "ZMQ_PORT=${ZMQ_PORT:-5555}" >> .env
          echo "ZMQ_HOST=${ZMQ_HOST:-127.0.0.1}" >> .env
          echo "FASTAPI_HOST=${FASTAPI_HOST:-127.0.0.1}" >> .env
          echo "FASTAPI_PORT=${FASTAPI_PORT:-0}" >> .env
          echo "APP_LOG_DIR=${APP_LOG_DIR:-./app_logs}" >> .env
          echo "APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}" >> .env
          echo "APP_LOG_TO_CONSOLE=${APP_LOG_TO_CONSOLE:-true}" >> .env
          echo "APP_LOG_TO_FILE=${APP_LOG_TO_FILE:-true}" >> .env
          echo "APP_LOG_MAX_FILE_SIZE_MB=${APP_LOG_MAX_FILE_SIZE_MB:-10}" >> .env
          echo "APP_LOG_BACKUP_COUNT=${APP_LOG_BACKUP_COUNT:-5}" >> .env
          echo "APP_LOG_FORMAT=${APP_LOG_FORMAT:-detailed}" >> .env

      # 6. Install Node dependencies and build the Electron app
      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm install
        shell: bash

      - name: Build Electron App
        run: |
          cd dashboard
          npm run build
          npx electron-builder --publish never
        shell: bash

      # 7. Upload the final built apps as Artifacts
      - name: Upload Built App
        uses: actions/upload-artifact@v4
        with:
          name: wolftrack-app-${{ matrix.os }}
          path: |
            dashboard/release/*.exe
            dashboard/release/*.dmg
            dashboard/release/*.AppImage
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set Release Tag
        id: tag
        run: echo "tag_name=nightly" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          prerelease: true
          overwrite_files: true
          files: |
            artifacts/wolftrack-app-ubuntu-latest/*.AppImage
            artifacts/wolftrack-app-windows-latest/*.exe
            artifacts/wolftrack-app-macos-latest/*.dmg
